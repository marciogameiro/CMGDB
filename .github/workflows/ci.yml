# Continuous integration: build from source, run the test suite, and run
# the benchmark quick suite as a correctness gate (it validates the computed
# Morse graphs, reachability, and Conley indices against frozen references
# in benchmarks/references.json and fails on any mismatch) — on every
# platform the wheels are published for.
#
# Linux and macOS use system Boost/GMP (apt/brew). Windows builds Boost
# from source and GMP via vcpkg, both cached so only the first run on a
# given platform pays the build cost.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # windows-11-arm is not allowed to block CI while Python dependency
    # wheels (matplotlib in particular) remain spotty on that platform
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm,
             macos-latest, macos-15-intel,
             windows-latest, windows-11-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libgmp-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install boost gmp

      - name: Cache Boost (Windows)
        if: runner.os == 'Windows'
        id: cache-boost
        uses: actions/cache@v6
        with:
          path: C:/boost
          key: boost-1.88.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build Boost (Windows)
        if: runner.os == 'Windows' && steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -L -o boost_1_88_0.tar.bz2 https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.bz2
          tar --bzip2 -xf boost_1_88_0.tar.bz2
          cd boost_1_88_0
          ./bootstrap.sh --prefix=C:/boost
          ./b2 install -d0 -j4 toolset=msvc --with-chrono --with-thread --with-serialization --with-date_time --with-atomic
        shell: bash

      - name: Cache GMP (Windows)
        if: runner.os == 'Windows'
        id: cache-gmp
        uses: actions/cache@v6
        with:
          path: C:/vcpkg/installed
          key: vcpkg-gmp-${{ runner.os }}-${{ runner.arch }}

      - name: Install GMP (Windows)
        if: runner.os == 'Windows' && steps.cache-gmp.outputs.cache-hit != 'true'
        run: |
          # The windows-11-arm runner image does not ship vcpkg; bootstrap
          # it into the same C:/vcpkg location the x64 image provides
          if [ ! -f /c/vcpkg/vcpkg.exe ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg /c/vcpkg
            cmd //c "C:\\vcpkg\\bootstrap-vcpkg.bat"
          fi
          /c/vcpkg/vcpkg install gmp
        shell: bash

      - name: Set library roots (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "BOOST_ROOT=C:/boost" >> $GITHUB_ENV
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "GMP_ROOT=C:/vcpkg/installed/arm64-windows" >> $GITHUB_ENV
          else
            echo "GMP_ROOT=C:/vcpkg/installed/x64-windows" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build and install
        run: pip install .

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -q

      - name: Benchmark correctness gate
        run: python benchmarks/benchmark.py --repeat 1 --timeout 900
