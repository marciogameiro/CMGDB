# Build wheels and publish the Python distribution package.
# A push of a v* tag builds and publishes to PyPI.
# A manual run (workflow_dispatch) builds the wheels only; check the
# "publish" box to also publish them to TestPyPI. The built wheels and
# sdist are attached to the run as artifacts either way.
name: Build and publish wheels

on:
  push:
    tags:
      - v* # Push events to v* tags
  # Manual run
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built wheels to TestPyPI'
        type: boolean
        default: false

env:
  BUILD_TYPE: Release

jobs:
  # Build wheels for Linux, macOS, and Windows.
  # All CPython versions allowed by requires-python in pyproject.toml
  # are built (cibuildwheel reads requires-python and skips the rest).
  build_wheels:
    name: Wheels for ${{ matrix.buildplat[0] }}-${{ matrix.buildplat[2] }}
    runs-on: ${{ matrix.buildplat[0] }}

    strategy:
      # Build the other wheels even if one fails
      fail-fast: false
      matrix:
        buildplat:
          # Linux: x86_64 plus native aarch64 (ubuntu-24.04-arm runner, no QEMU)
          - [ubuntu-latest,   x86_64,  manylinux_x86_64 ]
          - [ubuntu-24.04-arm, aarch64, manylinux_aarch64]
          # macOS: macos-15-intel is the last Intel runner, macos-latest is Apple silicon
          - [macos-15-intel,  x86_64,  macosx_x86_64    ]
          - [macos-latest,    arm64,   macosx_arm64     ]
          # Windows: win_amd64 covers both Intel and AMD 64-bit CPUs;
          # win_arm64 builds natively on the windows-11-arm runner
          - [windows-latest,  AMD64,   win_amd64        ]
          - [windows-11-arm,  ARM64,   win_arm64        ]
        include:
          # Configuration flag for target macOS
          - buildplat: [macos-15-intel,  x86_64,  macosx_x86_64    ]
            macosx_deployment_target: 13.0
          - buildplat: [macos-latest,    arm64,   macosx_arm64     ]
            macosx_deployment_target: 14.0

    steps:
      # The repository is self-contained: pyproject.toml (scikit-build-core)
      # and CMakeLists.txt at the root are the build configuration
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python for Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Boost is built from source and cached per platform+arch; only the
      # first run on a given configuration pays the build cost. The install
      # prefixes are fixed: /Users/runner on macOS, C:/boost on Windows.
      # restore/save are split so a finished Boost build is saved even if a
      # later step of the job fails (the combined cache action only saves
      # when the whole job succeeds)
      - name: Restore Boost cache (macOS)
        if: runner.os == 'macOS'
        id: cache-boost-macos
        uses: actions/cache/restore@v6
        with:
          path: |
            /Users/runner/include/boost
            /Users/runner/lib
          # The deployment target is part of the key: the dylibs must be
          # built for the wheel's minimum macOS, not the runner's OS
          key: boost-1.88.0-static-${{ runner.os }}-${{ runner.arch }}-target${{ matrix.macosx_deployment_target }}

      # Windows x64 uses the official prebuilt MSVC binaries (minutes
      # instead of the ~40-60 minute source build); no prebuilt exists for
      # ARM64, which builds from source behind a cache
      - name: Install Boost (Windows x64, prebuilt)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: |
          curl -L --fail --retry 3 -o boost_prebuilt.exe https://archives.boost.io/release/1.88.0/binaries/boost_1_88_0-msvc-14.3-64.exe
          # The prebuilt binaries ship as an Inno Setup installer (not a 7z
          # self-extractor); run it silently and wait for it to finish
          powershell -Command "Start-Process -FilePath 'boost_prebuilt.exe' -ArgumentList '/VERYSILENT','/NORESTART','/SP-','/SUPPRESSMSGBOXES','/DIR=C:\boost_prebuilt' -Wait"
          test -d /c/boost_prebuilt/lib64-msvc-14.3 || { echo "unexpected Boost layout:"; ls /c/boost_prebuilt; exit 1; }
          echo "BOOST_ROOT=C:/boost_prebuilt" >> $GITHUB_ENV
          echo "Boost_DIR=C:/boost_prebuilt/lib64-msvc-14.3/cmake/Boost-1.88.0" >> $GITHUB_ENV
        shell: bash

      - name: Restore Boost cache (Windows ARM)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        id: cache-boost-windows
        uses: actions/cache/restore@v6
        with:
          path: C:/boost
          key: boost-1.88.0-static-${{ runner.os }}-${{ runner.arch }}

      - name: Install boost for macOS Intel
        if: matrix.buildplat[2] == 'macosx_x86_64' && steps.cache-boost-macos.outputs.cache-hit != 'true'
        env:
          # Build the dylibs for the wheel's minimum macOS, not the
          # runner's OS, or delocate rejects the repaired wheel
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          INSTALL_PREFIX="/Users/runner"
          curl -L -o boost_1_88_0.tar.bz2 https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.bz2
          tar --bzip2 -xf boost_1_88_0.tar.bz2
          cd boost_1_88_0
          ./bootstrap.sh --prefix=${INSTALL_PREFIX}
          ./b2 install -d0 -j4 \
            cxxflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            linkflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            --with-chrono --with-thread --with-serialization --with-date_time --with-atomic
        shell: bash

      - name: Install boost for macOS ARM
        if: matrix.buildplat[2] == 'macosx_arm64' && steps.cache-boost-macos.outputs.cache-hit != 'true'
        env:
          # Build the dylibs for the wheel's minimum macOS, not the
          # runner's OS, or delocate rejects the repaired wheel
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          INSTALL_PREFIX="/Users/runner"
          curl -L -o boost_1_88_0.tar.bz2 https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.bz2
          tar --bzip2 -xf boost_1_88_0.tar.bz2
          cd boost_1_88_0
          ./bootstrap.sh --prefix=${INSTALL_PREFIX}
          ./b2 install -d0 -j4 architecture=arm \
            cxxflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            linkflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            --with-chrono --with-thread --with-serialization --with-date_time --with-atomic
        shell: bash

      - name: Install Boost for Windows ARM
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && steps.cache-boost-windows.outputs.cache-hit != 'true'
        run: |
          INSTALL_PREFIX="C:/boost"
          curl -L -o boost_1_88_0.tar.bz2 https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.bz2
          tar --bzip2 -xf boost_1_88_0.tar.bz2
          cd boost_1_88_0
          ./bootstrap.sh --prefix=${INSTALL_PREFIX}
          ./b2 install -d0 -j4 toolset=msvc architecture=arm address-model=64 \
            link=static variant=release \
            --with-chrono --with-thread --with-serialization --with-date_time --with-atomic
          echo "Installed Boost libraries:"
          ls /c/boost/lib
        shell: bash

      - name: Save Boost cache (macOS)
        if: runner.os == 'macOS' && steps.cache-boost-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /Users/runner/include/boost
            /Users/runner/lib
          key: boost-1.88.0-static-${{ runner.os }}-${{ runner.arch }}-target${{ matrix.macosx_deployment_target }}

      - name: Save Boost cache (Windows ARM)
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && steps.cache-boost-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:/boost
          key: boost-1.88.0-static-${{ runner.os }}-${{ runner.arch }}

      - name: Set BOOST_ROOT
        id: set-boost-root
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "BOOST_ROOT=/Users/runner" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "Windows" ] && [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "BOOST_ROOT=C:/boost" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # Set by the prebuilt install step
            echo "BOOST_ROOT=${BOOST_ROOT}" >> $GITHUB_OUTPUT
          else
            echo "BOOST_ROOT=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # GMP headers (gmpxx.h) are needed at compile time; nothing links GMP
      - name: Install GMP for macOS
        if: runner.os == 'macOS'
        run: |
          brew install gmp
        shell: bash

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Show library root directories
        run: |
          echo "BOOST_ROOT is " ${{ steps.set-boost-root.outputs.BOOST_ROOT }}
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # cp315 wheels build fine but cannot be tested until matplotlib
          # (a CMGDB dependency) ships cp315 wheels for the test env
          CIBW_TEST_SKIP: 'cp315-*'
          CIBW_BUILD: cp*-${{ matrix.buildplat[2] }}
          CIBW_ARCHS: ${{ matrix.buildplat[1] }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
          CIBW_ENVIRONMENT_WINDOWS: >
            BOOST_ROOT=${{ steps.set-boost-root.outputs.BOOST_ROOT }}
            Boost_DIR=${{ env.Boost_DIR }}
          CIBW_ENVIRONMENT_MACOS: >
            BOOST_ROOT=${{ steps.set-boost-root.outputs.BOOST_ROOT }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macosx_deployment_target }}
          CIBW_BEFORE_ALL_LINUX: >
            curl -L -o boost_1_88_0.tar.bz2 https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.bz2 &&
            tar --bzip2 -xf boost_1_88_0.tar.bz2 && cd boost_1_88_0 && ./bootstrap.sh --prefix=/usr/local &&
            ./b2 install -d0 -j4 --with-chrono --with-thread --with-serialization --with-date_time --with-atomic &&
            ls -l /usr/local
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            DYLD_LIBRARY_PATH=${BOOST_ROOT}/lib delocate-listdeps {wheel} &&
            DYLD_LIBRARY_PATH=${BOOST_ROOT}/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair -w {dest_dir} {wheel}
        with:
          output-dir: wheelhouse

      - name: Show files
        run: ls -lh wheelhouse
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.buildplat[0] }}-${{ matrix.buildplat[1] }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  # Build source distribution on Linux
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build source tarball
      run: pipx run build --sdist

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cibw-sdist
        path: dist/*.tar.gz

  # Manual runs publish to TestPyPI only when the "publish" box is checked
  # (trusted publishing must be configured for this repository on
  # test.pypi.org)
  upload_testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    name: Upload to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Publish package to TestPyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        attestations: false

  # Tag pushes publish to PyPI. The 'pypi' GitHub environment can be given
  # required reviewers in the repository settings to gate releases manually.
  upload_pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        attestations: true
