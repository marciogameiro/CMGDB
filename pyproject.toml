[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "CMGDB"
version = "1.5.2"
description = "CMGDB (Conley Morse Graph Database) Python Extension"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Marcio Gameiro", email = "marciogameiro@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "graphviz>=0.20",
  "matplotlib>=3.6.0",
  "numpy>=1.23.0",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/marciogameiro/CMGDB"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/CMGDB"]
build-dir = "build/{wheel_tag}"
cmake.args = [
  "-DUSER_PROJECT_PATH=src/CMGDB/_cmgdb",
]
# Keep the C++ source tree (including the vendored sdsl headers) out of
# wheels; the compiled extension _cmgdb.*.so is not under the _cmgdb/
# directory and is unaffected by this pattern.
wheel.exclude = [
  "**/_cmgdb/**",
]
# Exclude the example notebooks but keep the small .dat data files:
# the test and benchmark suites read examples/Leslie_500.dat.
sdist.exclude = [
  "examples/*.ipynb",
  ".github"
]

[tool.cibuildwheel]
# build-frontend = "build[uv]"
test-command = "pytest {project}/tests"
test-extras = ["test"]
